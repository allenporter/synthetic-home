---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^tests/snapshots/|^tests/fixtures/'
      - id: end-of-file-fixer
        exclude: '^tests/snapshots/|^tests/fixtures/'
      - id: check-yaml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-project ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or:
          - python
          - pyi
      - id: ruff-format
        name: ruff format
        entry: uv run --no-project ruff format
        language: system
        types_or:
          - python
          - pyi
      - id: ty
        name: ty check
        entry: uv run --no-project ty check --ignore unresolved-import
        language: system
        types_or:
          - python
          - pyi
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        exclude: '^tests/snapshots/.*\.yaml$'
        args:
          - --strict
          - -c
          - ".yaml-lint.yaml"
